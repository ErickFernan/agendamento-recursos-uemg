name: Testes Automatizados (Pytest)

on:
  pull_request:
    branches: [ "dev", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 3. Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 4. Executar a suíte de testes com Pytest
        env:
          # Variáveis de ambiente temporárias para o teste rodar na nuvem
          JWT_SECRET_KEY: "2912caec3e5d084b955dab8de18b9207f80130a7ef5c07ed6630546bc5761600"
          SECRET_KEY: "2912caec3e5d084b955dab8de18b9207f80130a7ef5c07ed6630546bc5761600"
          # Se o seu conftest.py usa SQLite em memória (sqlite:///:memory:), não precisa de Postgres aqui
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest -v
          