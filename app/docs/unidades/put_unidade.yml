Atualiza totalmente uma unidade (Substituição)
---
tags:
  - Unidades
parameters:
  - in: path
    name: id
    type: integer
    required: true
    description: ID numérico da unidade
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - nome
        - sigla
        - cidade
        - estado
      properties:
        nome:
          type: string
          example: "Universidade do Estado de Minas Gerais - Modificada"
        sigla:
          type: string
          example: "UEMG"
        cidade:
          type: string
          example: "Carangola"
        estado:
          type: string
          example: "MG"
responses:
  200:
    description: Unidade atualizada com sucesso
  400:
    description: Dados inválidos
  404:
    description: Unidade não encontrada