Atualiza parcialmente uma unidade (Envie apenas o que deseja mudar)
---
tags:
  - Unidades
security:
  - Bearer: []
parameters:
  - in: path
    name: id
    type: integer
    required: true
    description: ID numérico da unidade
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        nome:
          type: string
          example: "Novo Nome do Campus"
        estado:
          type: string
          example: "SP"
responses:
  200:
    description: Unidade atualizada parcialmente com sucesso
  400:
    description: Dados inválidos
  401:
    description: "Não autorizado. Token de acesso ausente ou inválido."
  403:
    description: "Acesso negado. Requer privilégios de administrador."
  404:
    description: Unidade não encontrada
  500:
    description: Erro interno no servidor