Cria um novo recurso (Apenas Admin)
---
tags:
  - Recursos
security:
  - Bearer: []
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - nome
        - capacidade
        - unidade_id
        - categoria_id
      properties:
        nome:
          type: string
          example: "Laboratório de Informática 01"
        capacidade:
          type: integer
          example: 30
        unidade_id:
          type: integer
          example: 1
        categoria_id:
          type: integer
          example: 1
responses:
  201:
    description: Recurso criado com sucesso
  400:
    description: Dados inválidos
  401:
    description: Token JWT ausente, inválido ou expirado
  403:
    description: Acesso negado (requer perfil admin)
  404:
    description: Unidade ou categoria informada não existe
  409:
    description: Já existe um recurso com este nome nesta unidade
  500:
    description: Erro interno no servidor