tags:
  - Usuários
summary: "Atualizar usuário completamente"
description: "Atualiza todos os dados cadastrais do usuário. Substitui o recurso inteiro."
consumes:
  - "application/json"
produces:
  - "application/json"
parameters:
  - in: "path"
    name: "id"
    type: "integer"
    required: true
    description: "ID numérico do usuário"
  - in: "body"
    name: "body"
    required: true
    schema:
      type: "object"
      required:
        - nome
        - email
        - unidade_id
      properties:
        nome:
          type: "string"
        email:
          type: "string"
        unidade_id:
          type: "integer"
responses:
  200:
    description: "Usuário atualizado com sucesso."
  400:
    description: "Dados inválidos."
  404:
    description: "Usuário ou Unidade não encontrados."
  409:
    description: "E-mail já em uso por outro usuário."
