tags:
  - Usuários
summary: "Listar todos os usuários"
description: "Retorna uma lista com todos os usuários cadastrados. As senhas em hash são omitidas por segurança."
produces:
  - "application/json"
security:
  - Bearer: []
responses:
  200:
    description: "Operação bem-sucedida."
    schema:
      type: "array"
      items:
        type: "object"
        properties:
          id:
            type: "integer"
          nome:
            type: "string"
          email:
            type: "string"
          unidade_id:
            type: "integer"
  401:
    description: "Não autorizado. Token de acesso ausente ou inválido."
  403:
    description: "Acesso negado. Requer privilégios de administrador."
  500:
    description: "Erro interno no servidor."