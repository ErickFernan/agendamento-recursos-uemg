tags:
  - Usuários
summary: "Deletar um usuário"
description: "Remove um usuário do banco de dados, desde que ele não possua agendamentos vinculados."
produces:
  - "application/json"
security:
  - Bearer: []
parameters:
  - in: "path"
    name: "id"
    type: "integer"
    required: true
    description: "ID numérico do usuário"
responses:
  200:
    description: "Usuário deletado com sucesso."
  401:
    description: "Não autorizado. Token de acesso ausente ou inválido."
  403:
    description: "Acesso negado. Requer privilégios de administrador."
  404:
    description: "Usuário não encontrado."
  409:
    description: "Conflito: Usuário possui agendamentos vinculados."