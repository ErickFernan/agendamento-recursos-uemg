tags:
  - Usuários
summary: "Atualizar usuário parcialmente"
description: "Atualiza apenas os campos enviados no JSON. Ideal para pequenas modificações."
consumes:
  - "application/json"
produces:
  - "application/json"
security:
  - Bearer: []
parameters:
  - in: "path"
    name: "id"
    type: "integer"
    required: true
    description: "ID numérico do usuário"
  - in: "body"
    name: "body"
    required: true
    schema:
      type: "object"
      properties:
        nome:
          type: "string"
        email:
          type: "string"
        unidade_id:
          type: "integer"
        senha:
          type: "string"
          description: "Se enviada, a senha será atualizada (criptografada)."
responses:
  200:
    description: "Usuário atualizado com sucesso."
  400:
    description: "Dados inválidos."
  401:
    description: "Não autorizado. Token de acesso ausente ou inválido."
  403:
    description: "Acesso negado. Requer privilégios de administrador."
  404:
    description: "Usuário ou Unidade não encontrados."
  409:
    description: "E-mail já em uso."