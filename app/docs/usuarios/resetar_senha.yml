tags:
  - Usuários
summary: "Redefinir senha de acesso"
description: "Endpoint específico para a redefinição de senha (esqueci minha senha/reset administrativo). Recebe apenas a nova senha."
consumes:
  - "application/json"
produces:
  - "application/json"
security:
  - Bearer: []
parameters:
  - in: "path"
    name: "id"
    type: "integer"
    required: true
    description: "ID numérico do usuário"
  - in: "body"
    name: "body"
    required: true
    schema:
      type: "object"
      required:
        - nova_senha
      properties:
        nova_senha:
          type: "string"
          description: "A nova senha desejada (mínimo 6 caracteres)."
          example: "NovaSenha123"
responses:
  200:
    description: "Senha atualizada com sucesso."
  400:
    description: "Senha ausente ou menor que 6 caracteres."
  401:
    description: "Não autorizado. Token de acesso ausente ou inválido."
  403:
    description: "Acesso negado. Requer privilégios de administrador."
  404:
    description: "Usuário não encontrado."