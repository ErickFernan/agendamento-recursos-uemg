Atualiza todos os dados de um agendamento existente
---
tags:
  - Agendamentos
security:
  - Bearer: []
parameters:
  - name: id
    in: path
    type: integer
    required: true
    description: ID do agendamento
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - data_hora_inicio
        - data_hora_fim
        - finalidade
        - recurso_id
      properties:
        data_hora_inicio:
          type: string
          format: date-time
          example: "2026-11-27T15:00:00"
        data_hora_fim:
          type: string
          format: date-time
          example: "2026-11-27T17:00:00"
        finalidade:
          type: string
          example: "Aula prática remarcada"
        recurso_id:
          type: integer
          example: 1
        usuario_id:
          type: integer
          example: 3
          description: Opcional. Apenas administradores podem alterar o solicitante
        status_id:
          type: integer
          example: 2
          description: Opcional. Usuários comuns só podem alterar para o status Cancelado
        participantes_ids:
          type: array
          items:
            type: integer
          example: [2]
responses:
  200:
    description: Agendamento atualizado com sucesso
  400:
    description: Dados inválidos, horário fora de hora inteira, fora da janela (07:00-22:00), fim de semana ou feriado (BR/MG) para usuários comuns
  401:
    description: Token JWT ausente, inválido ou expirado
  403:
    description: Sem permissão para editar este agendamento, trocar solicitante ou definir o status informado
  404:
    description: Agendamento, recurso, usuário, status ou participante não encontrado
  409:
    description: Conflito de horário com outro agendamento ativo
  500:
    description: Erro interno no servidor