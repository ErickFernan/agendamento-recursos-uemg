Remove um agendamento do sistema
---
tags:
  - Agendamentos
security:
  - Bearer: []
parameters:
  - name: id
    in: path
    type: integer
    required: true
    description: ID do agendamento
responses:
  200:
    description: Agendamento deletado com sucesso
