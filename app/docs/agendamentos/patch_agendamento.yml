Atualiza parcialmente um agendamento (ideal para aprovar, rejeitar ou cancelar)
---
tags:
  - Agendamentos
security:
  - Bearer: []
parameters:
  - name: id
    in: path
    type: integer
    required: true
    description: ID do agendamento
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        data_hora_inicio:
          type: string
          format: date-time
          example: "2026-11-27T18:00:00"
        data_hora_fim:
          type: string
          format: date-time
          example: "2026-11-27T20:00:00"
        finalidade:
          type: string
          example: "Finalidade atualizada"
        recurso_id:
          type: integer
          example: 1
        usuario_id:
          type: integer
          example: 3
        status_id:
          type: integer
          example: 2
          description: Admin pode definir qualquer status; solicitante comum só pode alterar para Cancelado
        participantes_ids:
          type: array
          items:
            type: integer
          example: [2, 3]
responses:
  200:
    description: Agendamento atualizado parcialmente com sucesso
  400:
    description: Dados inválidos ou horário fora da janela permitida
  401:
    description: Token JWT ausente, inválido ou expirado
  403:
    description: Sem permissão para alterar este agendamento ou status
  404:
    description: Agendamento, recurso, usuário, status ou participante não encontrado
  409:
    description: Conflito de horário com outro agendamento ativo
  500:
    description: Erro interno no servidor