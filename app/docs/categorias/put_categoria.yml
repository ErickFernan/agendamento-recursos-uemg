Atualiza todos os campos de uma categoria existente (Apenas Admin)
---
tags:
  - Categorias
security:
  - Bearer: []
parameters:
  - name: id
    in: path
    type: integer
    required: true
    description: ID da categoria
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          example: "Auditório"
        descricao:
          type: string
          example: "Espaços amplos para palestras e eventos"
responses:
  200:
    description: Categoria atualizada com sucesso
  400:
    description: Dados inválidos ou corpo JSON ausente
  401:
    description: Token JWT ausente, inválido ou expirado
  403:
    description: Acesso negado (requer privilégios de administrador)
  404:
    description: Categoria não encontrada
  409:
    description: Já existe uma categoria com este nome
  500:
    description: Erro interno no servidor